[env:esp32dev]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.5
    h2zero/NimBLE-Arduino@^1.4.2

board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728

build_flags =
    -D USER_SETUP_LOADED=1
    -D CONFIG_IDF_TARGET_ESP32=1
    -D CONFIG_FREERTOS_MAX_TASK_NAME_LEN=16

    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_BACKLIGHT_ON=HIGH

    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=21

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000